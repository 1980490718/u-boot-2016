<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>关于设置</title>
	<script src="common.js?v=f"></script>
	<link rel="stylesheet" href="style.css?v=f">
</head>
<body class="iframe-content">
	<div class="card about-card">
		<h2 class="has-tabs"><svg class="icon" viewBox="0 0 24 24"><use href="icons.svg?v=f#icon-router"/></svg><span id="about-title">关于设置</span><span class="tab-indicator" id="tab-indicator"></span></h2>

		<!-- 标签页导航 -->
		<div class="tab-nav">
			<div class="tab-item active" data-tab="info">设备信息</div>
			<div class="tab-item" data-tab="gpio">GPIO信息</div>
			<div class="tab-item" data-tab="smem">SMEM信息</div>
		</div>

		<div class="tab-container">
			<!-- 第1页：设备信息 -->
			<div class="tab-content active" id="tab-info">
				<div class="about-section">
					<table class="about-table" id="info-table">
						<tbody id="info-tbody"></tbody>
					</table>
				</div>
			</div>

			<!-- 第2页：GPIO信息 -->
			<div class="tab-content" id="tab-gpio">
				<div class="about-section">
					<table class="about-table" id="gpio-table">
						<thead><tr><th>名称</th><th>映射</th><th>GPIO</th><th>方向</th><th>当前值</th><th>电平</th><th>父系</th><th>来源</th><th>覆盖</th><th>操作</th></tr></thead>
						<tbody id="gpio-tbody"></tbody>
					</table>
				</div>
			</div>

			<!-- 第3页：SMEM信息 -->
			<div class="tab-content" id="tab-smem">
				<div class="about-section">
					<table class="about-table" id="smem-table">
						<thead id="smem-thead"><tr><th rowspan="2">名称</th><th colspan="2">起始</th><th colspan="2">结束</th><th colspan="3">大小</th><th rowspan="2">指向</th></tr><tr><th>块</th><th>地址</th><th>块</th><th>地址</th><th>块数</th><th>Hex</th><th>容量</th></tr></thead>
						<tbody id="smem-tbody"></tbody>
					</table>
				</div>
			</div>
		</div>
	</div>

	<script>
(function() {
	var ledTimers = {};

	function ledControl(name, action) {
		xhrGet('/led?name=' + encodeURIComponent(name) + '&action=' + action, function() {});
	}

	function startBlink(name) {
		if (ledTimers[name]) return;
		ledTimers[name] = setInterval(function() {
			ledControl(name, 'toggle');
		}, 500);
	}

	function stopBlink(name) {
		if (ledTimers[name]) {
			clearInterval(ledTimers[name]);
			delete ledTimers[name];
		}
	}

	function stopAllBlink() {
		Object.keys(ledTimers).forEach(stopBlink);
	}

	function mkBtn(text, attrs, style) {
		var b = document.createElement('button');
		b.textContent = text;
		b.className = 'about-sm-btn';
		for (var k in attrs) b.setAttribute(k, attrs[k]);
		if (style) for (var k in style) b.style[k] = style[k];
		return b;
	}

	function addBtn(parent, text, attrs, style, extra) {
		var b = mkBtn(text, attrs, style);
		if (extra) b.className += ' ' + extra;
		parent.appendChild(b);
		return b;
	}

	function bindLedButtons(gpioTbody) {
		gpioTbody.querySelectorAll('.about-sm-btn[data-act]').forEach(function(btn) {
			btn.addEventListener('click', function() {
				var name = this.getAttribute('data-led'), act = this.getAttribute('data-act');
				if (act === 'blink') {
					startBlink(name);
					this.style.display = 'none';
					this.parentElement.querySelector('[data-act="stop"][data-led="' + name + '"]').style.display = '';
				} else {
					stopBlink(name);
					var stopBtn = this.parentElement.querySelector('[data-act="stop"][data-led="' + name + '"]'),
					    blinkBtn = this.parentElement.querySelector('[data-act="blink"][data-led="' + name + '"]');
					if (stopBtn) stopBtn.style.display = 'none';
					if (blinkBtn) blinkBtn.style.display = '';
					ledControl(name, act);
				}
			});
		});

		gpioTbody.querySelectorAll('.about-blink-stop').forEach(function(btn) {
			btn.addEventListener('click', function() {
				var name = this.getAttribute('data-led');
				stopBlink(name);
				this.style.display = 'none';
				var blinkBtn = this.parentElement.querySelector('[data-act="blink"][data-led="' + name + '"]');
				if (blinkBtn) blinkBtn.style.display = '';
				ledControl(name, 'off');
			});
		});
	}

	var infoFields = [
		['机型', 'model'],
		['设置名称', 'config_name'],
		['设备ID', 'machid'],
		['内存大小', 'ram_size'],
		['闪存类型', 'flash_type'],
		['闪存信息', 'flash_chips'],
		['PHY/交换机', 'phy_switch_info'],
		['MAC地址', 'mac_addr'],
		['U-Boot版本', 'version']
	];

	function loadAbout() {
		var infoTbody = document.getElementById('info-tbody');
		infoTbody.innerHTML = '';
		infoFields.forEach(function(f) {
			var tr = document.createElement('tr');
			var td1 = document.createElement('td');
			td1.textContent = f[0];
			var td2 = document.createElement('td');
			td2.textContent = '-';
			td2.setAttribute('data-key', f[1]);
			tr.appendChild(td1);
			tr.appendChild(td2);
			infoTbody.appendChild(tr);
		});

		xhrGet('/about', function(data) {
			infoFields.forEach(function(f) {
				var key = f[1];
				var td = infoTbody.querySelector('[data-key="' + key + '"]');
				if (!td) return;
				td.textContent = key === 'ram_size' ? (data.ram_size ? formatSize(data.ram_size) : '-') : (data[key] || '-');
				if (key === 'config_name' && data.config_name_source) {
					td.className = 'about-gpio-ops';
					if (data.config_name_source === 'env') {
						addBtn(td, '恢复').onclick = function() { xhrPost('/env_set', 'config_name=', function() { loadAbout(); }); };
					} else if (data.config_name_source === 'fdt') {
						addBtn(td, '修改').onclick = function() {
							var v = prompt('输入 config_name 值 (如 config@xxx):');
							if (v !== null && v !== '')
								xhrPost('/env_set', 'config_name=' + encodeURIComponent(v), function() { loadAbout(); });
						};
					}
				}
			});

			var gpioTbody = document.getElementById('gpio-tbody');
			gpioTbody.innerHTML = '';
			var stickyIdx = 0;
			(data.gpios || []).forEach(function(g) {
				var tr = document.createElement('tr'), isLed = g.parent === 'led_gpio',
				    opsTd = document.createElement('td');
				opsTd.className = 'about-gpio-ops';
				if (isLed) {
					addBtn(opsTd, '点亮', {'data-led':g.name, 'data-act':'on'});
					addBtn(opsTd, '熄灭', {'data-led':g.name, 'data-act':'off'});
					addBtn(opsTd, '闪烁', {'data-led':g.name, 'data-act':'blink'});
					addBtn(opsTd, '停止', {'data-led':g.name, 'data-act':'stop'}, {display:'none'}, 'about-blink-stop');
				}
				if (g.override) {
					addBtn(opsTd, '恢复', {'data-override': g.override});
				} else if (!isLed && g.parent === 'key_gpio') {
					addBtn(opsTd, '修改', {'data-modify': 'reset_key'});
					addBtn(opsTd, '探测', {'data-detect': 'reset_key'});
				}
				if (!opsTd.hasChildNodes()) opsTd.textContent = '-';
				tr.innerHTML = [g.name||'-', g.alias||'', g.gpio, g.dir||'-',
					g.value, g.value?'高':'低', g.parent||'-',
					g.source==='env'?'变量':'fdt', g.override||''
				].map(function(v){return '<td>'+v+'</td>';}).join('');
				tr.appendChild(opsTd);
				if (opsTd.hasChildNodes() && opsTd.textContent !== '-') {
					tr.classList.add('gpio-btn-row');
					tr.style.top = (2 + stickyIdx * 2) + 'rem';
					stickyIdx++;
				}
				gpioTbody.appendChild(tr);
			});
			bindLedButtons(gpioTbody);
			gpioTbody.querySelectorAll('[data-override]').forEach(function(btn) {
				btn.onclick = function() {
					var key = this.getAttribute('data-override');
					xhrPost('/env_set', encodeURIComponent(key) + '=', function() { loadAbout(); });
				};
			});
			gpioTbody.querySelectorAll('[data-modify]').forEach(function(btn) {
				btn.onclick = function() {
					var key = this.getAttribute('data-modify'),
					    val = prompt('输入 ' + key + ' 的 GPIO 编号:');
					if (val !== null && val !== '')
						xhrPost('/env_set', encodeURIComponent(key) + '=' + encodeURIComponent(val), function() { loadAbout(); });
				};
			});
			gpioTbody.querySelectorAll('[data-detect]').forEach(function(btn) {
				btn.onclick = function() {
					if (detectTimer) {
						clearInterval(detectTimer);
						detectTimer = null;
						this.textContent = '探测';
						this.classList.remove('about-btn-pressed');
						Object.keys(detectExtraRows).forEach(function(gpio) {
							if (detectExtraRows[gpio].parentNode)
								detectExtraRows[gpio].parentNode.removeChild(detectExtraRows[gpio]);
						});
						detectExtraRows = {};
					} else {
						pollDetect();
						detectTimer = setInterval(pollDetect, 200);
						this.textContent = '停止';
						this.classList.add('about-btn-pressed');
					}
				};
			});
		});

		xhrGet('/partitions', function(data) {
			var smemTbody = document.getElementById('smem-tbody');
			smemTbody.innerHTML = '';
			(data.parts || []).forEach(function(p) {
				var tr = document.createElement('tr');
				var blkStart = (p.blk_start !== undefined) ? p.blk_start : '-';
				var blkEnd = (p.blk_start !== undefined && p.blk_size !== undefined) ? (p.blk_start + p.blk_size - 1) : '-';
				var blkSize = (p.blk_size !== undefined) ? p.blk_size : '-';
				tr.innerHTML = '<td>' + (p.name||'-') + '</td>'
					+ '<td>' + blkStart + '</td><td>' + formatHex(p.start) + '</td>'
					+ '<td>' + blkEnd + '</td><td>' + formatHex(p.start+p.size) + '</td>'
					+ '<td>' + blkSize + '</td><td>' + p.size.toString(16).toUpperCase() + '</td><td>' + formatSize(p.size) + '</td>'
					+ '<td>' + (p.flash||'-') + '</td>';
				smemTbody.appendChild(tr);
			});
		});
	}

	var detectTimer = null;
	var detectExtraRows = {};

	function pollDetect() {
		xhrGet('/btn_detect', function(data) {
			var gpioTbody = document.getElementById('gpio-tbody');
			data.forEach(function(b) {
				var found = false;
				var rows = gpioTbody.querySelectorAll('tr');
				for (var r = 0; r < rows.length; r++) {
					var cells = rows[r].querySelectorAll('td');
					if (cells.length > 1 && cells[2].textContent == b.gpio) {
						cells[4].textContent = b.value;
						cells[5].textContent = b.value ? '高' : '低';
						cells[5].className = b.value ? '' : 'about-btn-pressed';
						found = true;
						break;
					}
				}
				if (!found && !detectExtraRows[b.gpio]) {
					var tr = document.createElement('tr');
					tr.innerHTML =
						'<td>-</td>' +
						'<td></td>' +
						'<td>' + b.gpio + '</td>' +
						'<td>in</td>' +
						'<td>' + b.value + '</td>' +
						'<td' + (b.value ? '' : ' class="about-btn-pressed"') + '>' + (b.value ? '高' : '低') + '</td>' +
						'<td>-</td><td>-</td><td></td><td>-</td>';
					gpioTbody.appendChild(tr);
					detectExtraRows[b.gpio] = tr;
				}
				if (!found && detectExtraRows[b.gpio]) {
					var cells = detectExtraRows[b.gpio].querySelectorAll('td');
					cells[4].textContent = b.value;
					cells[5].textContent = b.value ? '高' : '低';
					cells[5].className = b.value ? '' : 'about-btn-pressed';
				}
			});
		});
	}

	// ===== 标签页切换逻辑 =====
	var indicator = document.getElementById('tab-indicator');
	var titleEl = document.getElementById('about-title');
	var tabTitles = { info: '设备信息', gpio: 'GPIO信息', smem: 'SMEM信息' };

	function switchTab(tabName) {
		var tabs = document.querySelectorAll('.tab-item');
		var contents = document.querySelectorAll('.tab-content');

		tabs.forEach(function(tab) {
			tab.classList.toggle('active', tab.getAttribute('data-tab') === tabName);
		});

		contents.forEach(function(content) {
			content.classList.toggle('active', content.id === 'tab-' + tabName);
		});

		titleEl.textContent = tabTitles[tabName] || '关于设置';
		document.title = tabTitles[tabName] || '关于设置';

		updateTabIndicator(indicator);
	}

	// 绑定标签页点击事件
	document.querySelectorAll('.tab-item').forEach(function(tab) {
		tab.addEventListener('click', function() {
			var tabName = this.getAttribute('data-tab');
			switchTab(tabName);
		});
	});

	window.addEventListener('pagehide', function() {
		stopAllBlink();
		if (detectTimer) clearInterval(detectTimer);
	});

	loadAbout();
	titleEl.textContent = tabTitles.info;
	updateTabIndicator(indicator);
	window.addEventListener('resize', function() { updateTabIndicator(indicator); });
})();
	</script>
</body>
</html>
