<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>备份分区</title>
	<script src="common.js?v=f"></script>
	<link rel="stylesheet" href="style.css?v=f">
</head>
<body class="iframe-content">
	<div class="card">
		<h2><svg class="icon" viewBox="0 0 24 24"><use href="icons.svg?v=f#icon-download"/></svg>备份分区</h2>
		<p>选择要备份的<b>分区名称</b>或<b>nor_full/nand_full</b>，<br>点击<b>确认</b>按钮保存到本地。</p>
		<div class="backup-row">
			<div class="backup-col">
				<label for="part-select">分区名称</label>
				<select id="part-select" ></select>
			</div>
			<div class="backup-col">
				<span class="label">分区信息</span>
				<div id="size-display" class="size-display"></div>
			</div>
		</div>
		<div class="button-container"><button id="backup-btn" disabled>确认</button></div>
		<div class="tips">
			<ul>
				<li class="backup-tip">rootfs分区可能读取及下载时间较长；</li>
				<li class="backup-tip">因内存限制，部分分区可能无法完成；</li>
				<li class="backup-tip">备份过程中请勿操作其他功能、刷新页面或断开连接。</li>
				<li id="backup-progress" style="display:none;list-style:none"></li>
			</ul>
		</div>
	</div>
	<script>
var sel=document.getElementById('part-select');
var sizeEl=document.getElementById('size-display');
var dlBtn=document.getElementById('backup-btn');
var partsData=[];
var nandType='none';

function updateSize(){
	var idx=sel.selectedIndex;
	var p=(idx>=0&&idx<partsData.length)?partsData[idx]:null;
	if(!p){sizeEl.textContent='';return;}
	if(p.full){var eccLabel=p.name.indexOf('nand')===0?(p.oob?' Data [ECC off] + '+formatSize(p.oob)+' OOB':' Data [ECC on]'):'';sizeEl.textContent='0x0-0x'+p.size.toString(16).toUpperCase()+' ('+formatSize(p.size)+eccLabel+')';return;}
	var emmc=p.flash==='emmc';
	var end=p.start+p.size;
	var sz=p.size;
	sizeEl.textContent='0x'+p.start.toString(16).toUpperCase()+'-0x'+end.toString(16).toUpperCase()+' ('+formatSize(sz)+')';
}

sel.onchange=updateSize;

function loadPartitions(){
	sel.disabled=true;
	dlBtn.disabled=true;
	sel.innerHTML='';
	sizeEl.textContent='';
	xhrGet('/partitions',function(data){
		if(!data.parts||!data.parts.length)return;
		partsData=data.parts;
		sel.innerHTML='';
		for(var i=0;i<partsData.length;i++){
			var opt=document.createElement('option');
			opt.value=i;
			opt.textContent=partsData[i].name;
			sel.appendChild(opt);
		}
		sel.disabled=false;
		dlBtn.disabled=false;
		var rawOk=data.nand_raw_size&&data.ram_available&&data.nand_raw_size<=data.ram_available;
		[{c:!!data.has_spi,n:'nor_full',l:'nor_full',s:data.spi_size||0,r:0},
		 {c:!!data.has_nand,n:'nand_full',l:'nand_full',s:data.nand_size||0,r:0},
		 {c:!!data.has_nand&&!!data.nand_raw_size,n:'nand_full',l:'nand_full_OOB'+(rawOk?'':' (chunked)'),s:data.nand_size||0,r:1,o:data.nand_raw_size-data.nand_size}
		].forEach(function(f){
			if(!f.c)return;
			var opt=document.createElement('option');
			opt.value=partsData.length;
			opt.textContent=f.l;
			sel.appendChild(opt);
			partsData.push({name:f.n,start:0,size:f.s,full:1,raw:f.r,oob:f.o||0});
		});
		nandType=data.nand_type||'none';
		updateSize();
	});
}

sel.onchange=updateSize;

var restoreTimer=0;
dlBtn.onclick=function(){
	var idx=sel.selectedIndex;
	if(idx<0||idx>=partsData.length)return;
	var p=partsData[idx];
	if(p.name==='nand_full'&&!p.raw){
		if(!confirm('不备份OOB可能破坏数据的完整性，建议使用nand_full_OOB模式。是否继续？')) return;
	}
	var name=p.name;
	var raw=!!p.raw;
	var totalSize=p.size+(p.oob||0);
	dlBtn.disabled=true;
	clearTimeout(restoreTimer);
	var progEl=document.getElementById('backup-progress');
	var tips=document.querySelectorAll('.backup-tip');
	tips.forEach(function(t){t.style.display='none';});
	progEl.style.display='';
	var spin='<svg class="icon icon-spin" viewBox="0 0 24 24"><use href="icons.svg?v=f#icon-refresh"/></svg>';
	var startTime=Date.now(),readTime=0;
	var tickTimer=setInterval(function(){progEl.innerHTML='读取耗时：'+((Date.now()-startTime)/1000).toFixed(0)+'s';},1000);
	dlBtn.innerHTML='读取中'+spin;
	var restoreTips=function(){tips.forEach(function(t){t.style.display='';});progEl.style.display='none';};
	var xhr=new XMLHttpRequest();
	xhr.open('GET','/backup?part='+encodeURIComponent(name)+(raw?'&raw=1':'')+'&size='+totalSize,true);
	xhr.responseType='blob';
	xhr.timeout=300000;
	xhr.onprogress=function(e){
		if(!e.loaded) return;
		if(!readTime){
			readTime=Date.now();
			clearInterval(tickTimer);
			dlBtn.innerHTML='接收中'+spin;
		}
		var info=formatSize(e.loaded)+(e.total?' / '+formatSize(e.total)+' ('+Math.round(e.loaded/e.total*100)+'%)':'');
		progEl.innerHTML='读取耗时：'+((readTime-startTime)/1000).toFixed(1)+'s<br>接收信息：'+info+'，耗时 '+((Date.now()-readTime)/1000).toFixed(0)+'s';
	};
	var resetBtn=function(){dlBtn.textContent='确认';clearInterval(tickTimer);dlBtn.disabled=false;};
	var onFail=function(msg){resetBtn();progEl.innerHTML=msg;restoreTimer=setTimeout(restoreTips,60000);};
	xhr.onload=function(){
		resetBtn();
		if(xhr.status===200){
			var now=Date.now();
			readTime=readTime||now;
			progEl.innerHTML='读取耗时：'+((readTime-startTime)/1000).toFixed(1)+'s<br>接收信息：'+formatSize(xhr.response.size||0)+'，耗时 '+((now-readTime)/1000).toFixed(1)+'s<br>接收完成，总耗时 '+((now-startTime)/1000).toFixed(1)+'s。';
			var blob=new Blob([xhr.response]);
			var url=URL.createObjectURL(blob);
			var a=document.createElement('a');
			a.href=url;
			a.download=name+(raw?'_oob':'')+'.bin';
			document.body.appendChild(a);
			a.click();
			document.body.removeChild(a);
			URL.revokeObjectURL(url);
		} else {
			progEl.innerHTML='下载失败。';
		}
		restoreTimer=setTimeout(restoreTips,60000);
	};
	xhr.ontimeout=function(){onFail('下载超时。');};
	xhr.onerror=function(){onFail('下载出错。');};
	xhr.send();
};

loadPartitions();
	</script>
</body>
</html>
