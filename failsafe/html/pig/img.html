<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>编程模式</title>
	<script src="common.js?v=f"></script>
	<link rel="stylesheet" href="style.css?v=f">
</head>
<body class="iframe-content">
	<div class="card">
		<h2><svg class="icon" viewBox="0 0 24 24"><use href="icons.svg?v=f#icon-cpu"/></svg>编程模式</h2>
		<p>将进入<b>编程模式</b>对闪存进行全量编程刷写。<br>请选择<b>目标闪存</b>和<b>IMG文件</b>，然后点击<b>确认</b>按钮。</p>
		<form enctype="multipart/form-data" name="img" id="img-form">
			<div class="backup-row">
				<div class="backup-col">
					<label for="flash-select">目标闪存</label>
					<select id="flash-select" disabled></select>
				</div>
				<div class="backup-col">
					<span class="label">闪存容量</span>
					<div id="size-display" class="size-display"></div>
				</div>
			</div>
			<div class="form-group">
				<input type="hidden" name="img_flash" id="img-flash" value="img_nor">
			<label for="img-file">请选择<b>IMG文件</b></label>
			<input type="file" name="img" id="img-file" accept=".img,.IMG,.bin,.BIN" required>
		</div>
			<div class="button-container"><button type="submit" id="submit-btn" disabled>确认</button></div>
		</form>
		<div class="tips tips-danger">
			<ul>
				<li class="file-tip">请确认所选的IMG文件是正确的；</li>
				<li class="file-tip">编程模式<span style="color:red">非常危险</span>，可能会损坏设备；</li>
				<li class="file-tip" id="img-reboot-tip">更新完成后将自动重启。</li>
				<li id="sha256-display" style="display:none;list-style:none"></li>
			</ul>
		</div>
	</div>
	<script src="submit.js?v=f"></script>
	<script>
	(function() {
		window.bkType='IMG';
		var sel = document.getElementById('flash-select');
		var sizeEl = document.getElementById('size-display');
		var submitBtn = document.getElementById('submit-btn');
		var devices = [];
		var nandType = 'none';

		function updateRebootTip() {
			var autoReboot = true;
			try { autoReboot = localStorage.getItem('auto_reboot') !== '0'; } catch (e) {}
			var tipEl = document.getElementById('img-reboot-tip');
			if (tipEl) {
				tipEl.innerHTML = autoReboot ? '更新完成后将自动重启。' : '按需自动或手动重启。';
			}
		}

		function updateSelection() {
			var dev = devices[sel.selectedIndex];
			if (!dev) return;
			var eccLabel = dev.name.indexOf('nand') >= 0 ? (dev.oob ? ' Data [ECC off] + ' + formatSize(dev.oob) + ' OOB' : ' Data [ECC on]') : '';
			sizeEl.textContent = '0x0-0x' + dev.size.toString(16).toUpperCase() + ' (' + formatSize(dev.size) + eccLabel + ')';
			document.getElementById('img-flash').value = dev.raw ? 'img_nand_raw' : dev.name;
		}

		sel.onchange = updateSelection;

		xhrGet('/partitions', function(data) {
			devices = [];
			sel.innerHTML = '';
			nandType = data.nand_type || 'none';
			var rawOk = data.nand_raw_size && data.ram_available && data.nand_raw_size <= data.ram_available;
			data.has_spi && data.spi_size > 0 && devices.push({name: 'img_nor', label: 'SPI NOR', size: data.spi_size, raw: 0});
			data.has_nand && data.nand_size > 0 && devices.push({name: 'img_nand', label: 'NAND', size: data.nand_size, raw: 0});
			data.has_nand && rawOk && devices.push({name: 'img_nand_raw', label: 'NAND_OOB', size: data.nand_size, raw: 1, oob: data.nand_raw_size - data.nand_size});
			data.has_emmc && data.emmc_size > 0 && devices.push({name: 'img_emmc', label: 'eMMC', size: data.emmc_size, raw: 0});
			devices.forEach(function(d) {
				var opt = document.createElement('option');
				opt.textContent = d.label;
				sel.appendChild(opt);
			});
			if (devices.length) {
				sel.disabled = submitBtn.disabled = false;
				updateSelection();
			}
		});

		submitBtn.addEventListener('click', function(e) {
			var selVal = document.getElementById('img-flash').value;
			if (selVal === 'img_nand') {
				if (!confirm('无OOB的数据编程可能导致ECC错误，建议选择NAND_OOB模式并选择带OOB数据的文件。是否继续？')) { e.preventDefault(); e.stopPropagation(); }
			}
		});

		updateRebootTip();
	})();
	</script>
</body>
</html>
